<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 900" role="img"
     aria-label="CI/CD pipeline across three separate AWS accounts, one per environment: a developer pushes to GitHub, which triggers Harness CI to check out and test the code, exporting test logs/reports to dev's S3 bucket, then build and push a container image to dev account's ECR using an OIDC-federated role. On tests passing, Harness CD deploys to dev's EKS cluster directly. To promote to qa and then prd, Harness pulls the exact image by digest from the previous environment's ECR and pushes it into the next environment's own ECR - a narrow, pipeline-only cross-account permission, never granted to cluster compute - before deploying there, with prd gated behind manual approval. Every environment's EKS cluster pulls only from its own account's ECR at runtime.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-promote" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>

    <symbol id="s-client" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="12" fill="#5B6472"/>
      <rect x="15" y="17" width="34" height="23" rx="2" fill="none" stroke="#fff" stroke-width="3"/>
      <line x1="24" y1="47" x2="40" y2="47" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="40" x2="32" y2="47" stroke="#fff" stroke-width="3"/>
    </symbol>
    <symbol id="s-github" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="12" fill="#24292F"/>
      <circle cx="22" cy="18" r="4" fill="#fff"/>
      <circle cx="22" cy="46" r="4" fill="#fff"/>
      <circle cx="44" cy="30" r="4" fill="#fff"/>
      <line x1="22" y1="22" x2="22" y2="42" stroke="#fff" stroke-width="2.5"/>
      <path d="M22,30 L40,30" stroke="#fff" stroke-width="2.5"/>
      <path d="M22,26 C22,30 22,30 26,30" fill="none" stroke="#fff" stroke-width="2.5"/>
    </symbol>
    <symbol id="s-harness" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="12" fill="#2563EB"/>
      <polyline points="14,18 22,32 14,46" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="26,18 34,32 26,46" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="38,18 46,32 38,46" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="s-s3" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="12" fill="#7AA116"/>
      <path d="M20,18 L44,18 L40,47 L24,47 Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="22" y1="25" x2="42" y2="25" stroke="#fff" stroke-width="2"/>
    </symbol>
    <symbol id="s-ecr" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="12" fill="#ED7100"/>
      <rect x="16" y="21" width="30" height="24" rx="2" fill="none" stroke="#fff" stroke-width="2.5"/>
      <line x1="16" y1="30" x2="46" y2="30" stroke="#fff" stroke-width="2"/>
      <circle cx="41" cy="17" r="3.5" fill="#fff"/>
    </symbol>
    <symbol id="s-eks" viewBox="0 0 64 64">
      <rect x="2" y="2" width="60" height="60" rx="12" fill="#ED7100"/>
      <rect x="15" y="15" width="15" height="15" rx="2" fill="#fff"/>
      <rect x="34" y="15" width="15" height="15" rx="2" fill="#fff" opacity="0.85"/>
      <rect x="15" y="34" width="15" height="15" rx="2" fill="#fff" opacity="0.85"/>
      <rect x="34" y="34" width="15" height="15" rx="2" fill="#fff" opacity="0.7"/>
    </symbol>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1680" height="900" fill="#eef1f5"/>
  <rect x="10" y="10" width="1660" height="880" rx="16" fill="#ffffff" stroke="#d8dee6" stroke-width="1.5"/>

  <text x="840" y="42" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#1a2130">CI/CD Pipeline — GitHub → Harness → EKS</text>
  <text x="840" y="64" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">How a commit becomes a running pod - 3 separate AWS accounts, one per environment (myapp)</text>

  <!-- Row A: developer, GitHub, Harness CI -->
  <use href="#s-client" x="50" y="100" width="72" height="72"/>
  <text x="86" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Developer</text>

  <use href="#s-github" x="230" y="100" width="72" height="72"/>
  <text x="266" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">GitHub</text>
  <text x="266" y="201" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">repo: myapp</text>

  <use href="#s-harness" x="430" y="100" width="72" height="72"/>
  <text x="466" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Harness CI</text>

  <line x1="122" y1="136" x2="225" y2="136" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="120" width="70" height="15" fill="#ffffff" opacity="0.9"/>
  <text x="175" y="131" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">git push</text>

  <line x1="302" y1="136" x2="425" y2="136" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="315" y="120" width="100" height="15" fill="#ffffff" opacity="0.9"/>
  <text x="365" y="131" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">webhook trigger</text>

  <!-- Branch into two CI stages -->
  <line x1="450" y1="172" x2="365" y2="246" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="482" y1="172" x2="655" y2="246" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>

  <rect x="260" y="250" width="200" height="40" rx="8" fill="#eef2ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="274" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">1. Checkout &amp; run tests</text>

  <rect x="560" y="250" width="200" height="40" rx="8" fill="#eef2ff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="660" y="274" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#334155">2. Build &amp; tag image</text>

  <!-- Account boundaries (drawn before their contents so contents render on top) -->
  <rect x="270" y="310" width="470" height="400" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="286" y="326" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#475569">dev</text>

  <rect x="990" y="430" width="210" height="280" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="1006" y="446" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#475569">AWS account: qa</text>

  <rect x="1240" y="430" width="210" height="280" rx="10" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="1256" y="446" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#475569">AWS account: prd</text>

  <!-- Stage 1 -> S3 CI artifacts (dev account) -->
  <line x1="360" y1="290" x2="360" y2="328" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="370" y="301" width="150" height="15" fill="#ffffff" opacity="0.9"/>
  <text x="445" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">exports logs/reports</text>

  <use href="#s-s3" x="324" y="345" width="72" height="72"/>
  <text x="360" y="433" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">S3 · CI artifacts</text>

  <!-- Stage 2 -> ECR:dev -->
  <line x1="660" y1="290" x2="660" y2="328" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="670" y="301" width="165" height="15" fill="#ffffff" opacity="0.9"/>
  <text x="752" y="312" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">docker push (OIDC role)</text>

  <use href="#s-ecr" x="624" y="345" width="72" height="72"/>
  <text x="660" y="433" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">ECR</text>

  <!-- ECR:dev -> Harness CD (Harness CD sits in the neutral gap between accounts) -->
  <line x1="696" y1="375" x2="898" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="345" width="120" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="800" y="357" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">on tests pass</text>

  <use href="#s-harness" x="860" y="290" width="72" height="72"/>
  <text x="896" y="378" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Harness CD</text>

  <!-- Promotion chain: ECR:dev -> ECR:qa -> ECR:prd (pipeline-driven copy, never a runtime cross-account pull) -->
  <use href="#s-ecr" x="1050" y="450" width="72" height="72"/>
  <text x="1086" y="538" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">ECR</text>

  <use href="#s-ecr" x="1300" y="450" width="72" height="72"/>
  <text x="1336" y="538" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">ECR</text>

  <line x1="696" y1="400" x2="1048" y2="470" stroke="#2563EB" stroke-width="1.75" marker-end="url(#arrow-promote)"/>
  <rect x="760" y="412" width="180" height="28" fill="#ffffff" opacity="0.9"/>
  <text x="850" y="424" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563EB">promote: pull by digest,</text>
  <text x="850" y="436" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563EB">push (Harness role only)</text>

  <line x1="1122" y1="486" x2="1298" y2="486" stroke="#2563EB" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrow-promote)"/>
  <rect x="1140" y="470" width="150" height="28" fill="#ffffff" opacity="0.9"/>
  <text x="1215" y="482" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563EB">promote, gated on</text>
  <text x="1215" y="494" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2563EB">qa sign-off</text>

  <!-- Local deploy: each account's own ECR -> its own EKS. No arrow ever crosses an account boundary here. -->
  <use href="#s-eks" x="600" y="580" width="72" height="72"/>
  <text x="636" y="668" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">EKS: dev</text>
  <text x="636" y="681" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">helm upgrade --install</text>

  <use href="#s-eks" x="1050" y="580" width="72" height="72"/>
  <text x="1086" y="668" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">EKS: qa</text>
  <text x="1086" y="681" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">helm upgrade --install</text>

  <use href="#s-eks" x="1300" y="580" width="72" height="72"/>
  <text x="1336" y="668" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">EKS: prd</text>
  <text x="1336" y="681" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">helm upgrade --install</text>

  <line x1="655" y1="417" x2="636" y2="578" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="586" y="490" width="140" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="656" y="502" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">① deploy (Harness CD)</text>

  <line x1="1086" y1="522" x2="1086" y2="578" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="1016" y="555" width="140" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="1086" y="567" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#334155">② deploy (Harness CD)</text>

  <line x1="1336" y1="522" x2="1336" y2="578" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrow-muted)"/>
  <rect x="1256" y="555" width="160" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="1336" y="567" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#64748b">③ deploy · gated</text>

  <!-- Footnote -->
  <text x="840" y="750" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#64748b">Each account has its own Harness OIDC role (modules/harness-oidc), ECR (infra/global), and EKS access entry (modules/eks-access) - Harness assumes a</text>
  <text x="840" y="764" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#64748b">different role per account. The only cross-account permission anywhere in this pipeline is narrow and pipeline-only: each account's ECR grants pull (never push,</text>
  <text x="840" y="778" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#64748b">never to compute) to the next environment's Harness role, for the promotion copy step above. No cluster ever pulls an image across an account boundary.</text>

  <!-- Legend -->
  <line x1="60" y1="800" x2="1620" y2="800" stroke="#e2e8f0" stroke-width="1"/>

  <text x="60" y="823" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">Color:</text>
  <rect x="140" y="815" width="14" height="14" rx="3" fill="#24292F"/>
  <text x="160" y="826" font-family="sans-serif" font-size="11" fill="#475569">Source control (GitHub)</text>
  <rect x="380" y="815" width="14" height="14" rx="3" fill="#2563EB"/>
  <text x="400" y="826" font-family="sans-serif" font-size="11" fill="#475569">CI/CD (Harness)</text>
  <rect x="600" y="815" width="14" height="14" rx="3" fill="#ED7100"/>
  <text x="620" y="826" font-family="sans-serif" font-size="11" fill="#475569">AWS compute/containers (ECR, EKS)</text>
  <rect x="950" y="815" width="14" height="14" rx="3" fill="#7AA116"/>
  <text x="970" y="826" font-family="sans-serif" font-size="11" fill="#475569">AWS storage (S3)</text>

  <text x="60" y="858" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569">Line style:</text>
  <line x1="150" y1="854" x2="180" y2="854" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="188" y="858" font-family="sans-serif" font-size="11" fill="#475569">pipeline flow</text>
  <line x1="330" y1="854" x2="360" y2="854" stroke="#2563EB" stroke-width="1.75" marker-end="url(#arrow-promote)"/>
  <text x="368" y="858" font-family="sans-serif" font-size="11" fill="#475569">promotion copy (Harness role, cross-account)</text>
  <line x1="700" y1="854" x2="730" y2="854" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="6,4" marker-end="url(#arrow-muted)"/>
  <text x="738" y="858" font-family="sans-serif" font-size="11" fill="#475569">gated on manual approval</text>
  <line x1="1080" y1="854" x2="1110" y2="854" stroke="#64748b" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="1118" y="858" font-family="sans-serif" font-size="11" fill="#475569">AWS account boundary</text>
</svg>
