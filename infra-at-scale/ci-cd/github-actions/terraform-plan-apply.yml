# PLACEHOLDER pipeline - copy to .github/workflows/terraform-plan-apply.yml at
# the repo root to activate. Runs `terraform plan` on every PR touching
# infra-at-scale/**, and `terraform apply` on push to main for whichever
# environment's directory changed. Authenticates via GitHub OIDC
# (modules/iam-github-oidc) - no long-lived AWS access keys anywhere.
name: infra-at-scale / terraform plan+apply

on:
  pull_request:
    paths:
      - "infra-at-scale/**"
  push:
    branches: [main]
    paths:
      - "infra-at-scale/**"

permissions:
  id-token: write # required for OIDC
  contents: read
  pull-requests: write # required to comment plan output on the PR

jobs:
  plan:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        environment: [dev, qa, staging, prod]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-at-scale/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      # PLACEHOLDER: role ARN comes from each environment's `github_actions_role_arn`
      # Terraform output - wire it in as a repo/environment secret, e.g.
      # AWS_ROLE_ARN_DEV, AWS_ROLE_ARN_QA, AWS_ROLE_ARN_STAGING, AWS_ROLE_ARN_PROD.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init -backend-config=backend.hcl
      - run: terraform fmt -check -recursive ../..
      - run: terraform validate
      - run: terraform plan -no-color -out=tfplan
      - run: terraform show -no-color tfplan

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      max-parallel: 1 # dev -> qa -> staging -> prod, never concurrent
      matrix:
        environment: [dev, qa, staging, prod]
    # prod requires manual approval - configure a GitHub Environment named
    # "prod" with required reviewers; this job's `environment:` binds to it.
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-at-scale/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', matrix.environment)] }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform init -backend-config=backend.hcl
      - run: terraform apply -auto-approve
